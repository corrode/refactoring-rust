# Build the book, test all code, deploy to GitHub Pages.
#
# Test source files, inline Rust, and the browser runner, then build the book.
# Before deployment, compile and run its exact rendered snippet/test pairs.
# Intentional starter failures must match their declared expectations.
#
# Deploys only happen on pushes to `main`. The `book` branch builds and
# tests but does not publish.

name: book

on:
  push:
    branches: [main, book]
  pull_request:
    branches: [main, book]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Integration tests verify intentional starter failures.
      # Solution tests have different names and must still run.
      - name: Test examples + solutions + integration tests
        run: >-
          cargo test --examples --tests --all-features -- --exact
          --skip tests::variable_and_declaration_ids_are_distinct
          --skip tests::debug_does_not_leak_token
          --skip tests::self_friendship_is_a_noop
          --skip tests::people_with_same_name_are_distinct

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test browser runner and snippet checker
        run: make book-runner-test

      # TODO(plugins): install mdbook-quiz and mdbook-mermaid here once
      # they're added to book.toml.

      - name: Test inline rust blocks
        working-directory: book
        run: mdbook test

      - name: Build the book
        working-directory: book
        run: mdbook build

      - name: Test rendered snippets and attached tests
        run: python3 scripts/check_book_snippets.py book/book

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
